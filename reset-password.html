<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reset Password · PolicyHub</title>
  <link rel="stylesheet" href="index.css" />
</head>
<body>
  <div class="page">
    <header class="topbar"><a class="brand" href="index.html">PolicyHub</a></header>
    <main>
      <section class="login-card">
        <p class="eyebrow">Account security</p>
        <h1>Set a new password</h1>
        <p class="intro">Choose a new password for your PolicyHub account.</p>
        <form id="reset-form">
          <div class="field"><label for="new-password">New password</label><input id="new-password" type="password" autocomplete="new-password" minlength="8" required /></div>
          <div class="field"><label for="confirm-password">Confirm new password</label><input id="confirm-password" type="password" autocomplete="new-password" minlength="8" required /></div>
          <button type="submit">Update password</button>
        </form>
        <p id="reset-result" class="login-result" role="status" aria-live="polite"></p>
        <a class="portal-link" href="index.html">Return to sign in →</a>
      </section>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script src="reset-password.js"></script>
</body>
</html>
