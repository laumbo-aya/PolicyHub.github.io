<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f4f7fb" />
  <title>Sign in · PolicyHub</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #15243a;
      background: #f4f7fb;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; min-height: 100vh; }
    .page { min-height: 100vh; display: grid; grid-template-rows: auto 1fr; }
    .topbar {
      height: 76px; display: flex; align-items: center; padding: 0 clamp(24px, 6vw, 88px);
      background: rgba(255,255,255,.82); border-bottom: 1px solid #e6ebf2;
    }
    .brand { display: inline-flex; align-items: center; gap: 11px; color: #15243a; font-size: 20px; font-weight: 750; letter-spacing: -.5px; text-decoration: none; }
    .brand-mark { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 10px; color: #fff; background: #315ee8; box-shadow: 0 5px 12px #315ee833; }
    main { display: grid; place-items: center; padding: 48px 20px 64px; }
    .login-card { width: min(100%, 430px); padding: 40px; background: #fff; border: 1px solid #e7ecf3; border-radius: 18px; box-shadow: 0 18px 55px rgba(35, 56, 90, .08); }
    .eyebrow { margin: 0 0 10px; color: #315ee8; font-size: 12px; font-weight: 750; letter-spacing: .11em; text-transform: uppercase; }
    h1 { margin: 0; font-size: 29px; letter-spacing: -1px; line-height: 1.2; }
    .intro { margin: 11px 0 30px; color: #718096; font-size: 14px; line-height: 1.6; }
    .field { margin-bottom: 19px; }
    label { display: block; margin-bottom: 8px; color: #34445b; font-size: 13px; font-weight: 650; }
    input { width: 100%; height: 48px; padding: 0 14px; border: 1px solid #d8e0eb; border-radius: 9px; outline: none; background: #fff; color: #15243a; font: inherit; font-size: 14px; transition: border-color .16s, box-shadow .16s; }
    input::placeholder { color: #a2adbd; }
    input:focus { border-color: #5579ed; box-shadow: 0 0 0 3px #315ee81c; }
    .password-label { display: flex; justify-content: space-between; align-items: center; }
    .password-label label { margin-bottom: 8px; }
    .forgot { margin-bottom: 8px; color: #315ee8; font-size: 12px; font-weight: 600; text-decoration: none; }
    .forgot:hover { text-decoration: underline; }
    button { width: 100%; height: 48px; margin-top: 6px; border: 0; border-radius: 9px; background: #315ee8; color: white; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; box-shadow: 0 7px 14px #315ee82b; transition: background .16s, transform .16s; }
    button:hover { background: #244ed0; }
    button:active { transform: translateY(1px); }
    button:focus-visible, a:focus-visible { outline: 3px solid #9ab0ff; outline-offset: 3px; }
    .note { margin: 23px 0 0; color: #8491a3; font-size: 12px; text-align: center; }
    @media (max-width: 480px) { .topbar { height: 66px; } .login-card { padding: 30px 24px; } h1 { font-size: 26px; } }
  </style>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <a class="brand" href="#" aria-label="PolicyHub home">
        <span class="brand-mark" aria-hidden="true">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M12 3 19 6v5c0 4.7-2.9 8.2-7 10-4.1-1.8-7-5.3-7-10V6l7-3Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="m9 12 2 2 4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        PolicyHub
      </a>
    </header>
    <main>
      <section class="login-card" aria-labelledby="login-title">
        <p class="eyebrow">Welcome back</p>
        <h1 id="login-title">Sign in to your account</h1>
        <p class="intro">Enter your credentials to access your PolicyHub workspace.</p>
        <form action="#" method="post">
          <div class="field">
            <label for="username">User Name</label>
            <input id="username" name="username" type="text" autocomplete="username" placeholder="Enter your user name" required />
          </div>
          <div class="field">
            <div class="password-label">
              <label for="password">Password</label>
              <a class="forgot" href="#">Forgot password?</a>
            </div>
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required />
          </div>
          <button type="submit">Sign in</button>
        </form>
        <p class="note">Secure access to your policy workspace</p>
      </section>
    </main>
  </div>
</body>
</html>
